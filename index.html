<style>

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg) radial-gradient(circle at 20% 20%,rgba(255,255,255,.12) 0 2px,transparent 3px) 0 0/34px 34px;color:var(--fg);font:15px system-ui,sans-serif}
.av{overflow:visible;display:block}
.av .bd,.av .arm,.av .ht,.av .eyes,.av .pu,.av .tg{transform-box:fill-box;animation-delay:var(--d,0s)}
.av .bd{transform-origin:50% 100%;animation:bob 1.9s ease-in-out infinite}
.av .arm{animation:wv 1.9s ease-in-out infinite}.av .arm.l{transform-origin:100% 0}.av .arm.r{transform-origin:0 0;animation-name:wv2}
.av .ht{transform-origin:50% 100%;animation:hw 2.6s ease-in-out infinite}
.av .eyes{transform-origin:50% 50%;animation:bl 4.2s infinite}
.av .pu{animation:lk 5.5s ease-in-out infinite}
.av .tg{transform-origin:50% 0;animation:tw .9s ease-in-out infinite}
.g .av .bd,.jmp .av .bd{animation:jp .55s ease-in-out infinite}

.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}#ov .box{max-height:100%;overflow:auto}#ov label{display:block;font-size:13px;margin:6px 0 2px;color:var(--mut)}

#tools{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#pal{display:grid;grid-template-columns:repeat(11,22px);gap:2px}#pal i{width:22px;height:22px;border:1px solid #0003;cursor:pointer}
.tb{padding:6px 10px;background:var(--card);color:var(--fg);border:2px solid var(--bd);font-size:18px}.tb.on{border-color:#4c6ef5;background:#dbe4ff;color:#000}
#chatbox{display:flex;flex-direction:column;height:480px}#chat{flex:1;overflow:auto;font-size:14px}#chat div{padding:3px 6px}#chat div:nth-child(odd){background:rgba(127,127,127,.1)}
.okc{color:#2b8a3e;font-weight:700}.cl{color:#e67700;font-weight:700}.sy{color:#4c6ef5}
@media(max-width:900px){#cols{grid-template-columns:1fr}#pl{order:3}#chatbox{height:220px}}

function clearCv(){ctx.fillStyle="#fff";ctx.fillRect(0,0,800,500)}
function fill(x,y,hex){const im=ctx.getImageData(0,0,800,500),d=im.data,i0=(y*800+x)*4,t=[d[i0],d[i0+1],d[i0+2]],f=[1,3,5].map(i=>parseInt(hex.substr(i,2),16));

  while(st.length){const q=st.pop();if(seen[q])continue;seen[q]=1;const i=q*4;

    d[i]=f[0];d[i+1]=f[1];d[i+2]=f[2];d[i+3]=255;const X=q%800;
    if(X>0)st.push(q-1);if(X<799)st.push(q+1);if(q>=800)st.push(q-800);if(q<399200)st.push(q+800)}
  ctx.putImageData(im,0,0)}
function drawOp(o){
  if(o.t==="f"){fill(o.x,o.y,o.c);return}
  const p=o.p;ctx.strokeStyle=ctx.fillStyle=o.c;ctx.lineWidth=o.k==="m"?o.w*1.6:o.w;ctx.lineCap=o.k==="m"?"square":"round";ctx.lineJoin="round";
  if(o.k==="s"){for(const q of p)for(let i=0;i<10;i++){const a=Math.random()*6.283,r=Math.random()*o.w*1.8;ctx.fillRect(q[0]+Math.cos(a)*r,q[1]+Math.sin(a)*r,2,2)}return}
  ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);if(p.length==1)ctx.lineTo(p[0][0]+.1,p[0][1]);for(let i=1;i<p.length;i++)ctx.lineTo(p[i][0],p[i][1]);ctx.stroke()}
function redraw(){clearCv();ops.forEach(drawOp)}
/* ---- lógica del anfitrión ---- */
const poolWords=()=>{const c=S.cfg.custom.split(",").map(s=>s.trim()).filter(Boolean);return S.cfg.only&&c.length>2?c:WORDS.concat(c)};
function pickOpts(){const pool=poolWords(),o=[];let g=0;while(o.length<S.cfg.words&&g++<60){const w=(!S.cfg.only&&Math.random()<.2)?PHR[Math.floor(Math.random()*PHR.length)]:pool[Math.floor(Math.random()*pool.length)];if(!o.includes(w))o.push(w)}return o}
function nextTurn(){const a=ids();S.turn++;
  if(S.turn>=a.length*S.cfg.rounds){S.phase="end";S.left=0;return send()}
  S.drawer=a[S.turn%a.length];S.opts=pickOpts();S.word=null;S.phase="choose";S.left=15;S.guessed=[];send()}
function startDraw(w){S.word=w;S.phase="draw";S.left=S.cfg.time;S.guessed=[];send()}
setInterval(()=>{if(!R||!isHost())return;
  if(S.phase==="choose"){S.left--;if(S.left<=0||!ids().includes(S.drawer))startDraw(S.opts[0]);else send()}
  else if(S.phase==="draw"){S.left--;const o=ids().filter(p=>p!==S.drawer);
    if(S.left<=0||!ids().includes(S.drawer)||(o.length&&o.every(p=>S.guessed.includes(p)))){S.phase="reveal";S.left=6}send()}
  else if(S.phase==="reveal"){S.left--;if(S.left<=0)nextTurn();else send()}},1000);
/* ---- interfaz ---- */
function hintText(){const w=S.word||"",idx=[...w].map((c,i)=>c===" "?-1:i).filter(i=>i>=0).sort((a,b)=>((a*7919+S.turn*104729)%97)-((b*7919+S.turn*104729)%97));
  const k=Math.min(S.cfg.hints,Math.floor((1-S.left/S.cfg.time)*(S.cfg.hints+1))),open=new Set(idx.slice(0,k));
  return[...w].map((c,i)=>c===" "?"\u00a0\u00a0":open.has(i)?c.toUpperCase():"_").join(" ")}
const CF=[["rounds","Rondas",2,10],["time","Tiempo de dibujo (s)",20,240],["words","Palabras a elegir",1,5],["hints","Pistas",0,5]];
function buildOv(){}
function setv(el,v){if(document.activeElement!==el){if(el.type==="checkbox")el.checked=v;else el.value=v}}
function renderOv(){const ov=$("ov"),me=myPeer();
  if(S.phase==="draw"){ov.classList.add("hide");return}
  ov.classList.remove("hide");
  if(S.phase==="lobby"||S.phase==="end"){
    if(!$("cfgf")||ov.dataset.m!=="cfg"){ov.dataset.m="cfg";ov.innerHTML=`<div class="box"><div id="endmsg" style="font-weight:800;font-size:18px"></div><h3 style="margin:4px 0">Ajustes de la partida</h3>`+
      `<div class="g2">`+CF.map(([k,l,a,b])=>`<div><label>${l}</label><select id="c_${k}">${Array.from({length:b-a+1},(_,i)=>`<option>${a+i}</option>`).join("")}</select></div>`).join("")+`</div>`+
      `<label>Palabras propias (separadas por comas)</label><textarea id="c_custom" rows="2" maxlength="1200"></textarea><label><input type="checkbox" id="c_only" style="width:auto"> Usar solo mis palabras (mín. 3)</label><p><button id="cfgf" style="width:100%">▶ ¡Empezar partida!</button></p><div id="hn" style="font-size:12px;color:var(--mut)"></div></div>`;
      CF.forEach(([k])=>$("c_"+k).onchange=e=>{if(isHost()){S.cfg[k]=+e.target.value;send()}});
      $("c_custom").oninput=e=>{if(isHost()){S.cfg.custom=e.target.value;send()}};$("c_only").onchange=e=>{if(isHost()){S.cfg.only=e.target.checked;send()}};
      $("cfgf").onclick=()=>R.emit("start",{})}
    CF.forEach(([k])=>{const el=$("c_"+k);setv(el,S.cfg[k]);el.disabled=!isHost()});
    setv($("c_custom"),S.cfg.custom);$("c_custom").disabled=!isHost();setv($("c_only"),S.cfg.only);$("c_only").disabled=!isHost();
    $("cfgf").disabled=!isHost();$("hn").textContent=isHost()?"Eres el anfitrión: tú controlas los ajustes.":"Solo el anfitrión ("+nameOf(hostId())+") puede cambiar los ajustes y empezar.";
    const top=ids().sort((a,b)=>(S.scores[b]||0)-(S.scores[a]||0))[0];$("endmsg").innerHTML=S.phase==="end"&&top?`<span class="jmp" style="display:inline-block;vertical-align:middle">${av(pr(top).av||DA,46)}</span> 🏆 Ganador/a: ${esc(nameOf(top))}`:"";return}
  ov.dataset.m=S.phase;
  if(S.phase==="choose"){ov.innerHTML=S.drawer===me?`<div><h2>¡Elige una palabra!</h2><div id="ch">${S.opts.map((w,i)=>`<button data-i="${i}">${esc(w)}</button>`).join("")}</div></div>`:`<h2>${esc(nameOf(S.drawer))} está eligiendo una palabra…</h2>`;
    ov.querySelectorAll("#ch button").forEach(b=>b.onclick=()=>R.emit("pick",{i:+b.dataset.i}))}
  else if(S.phase==="reveal")ov.innerHTML=`<div><div>La palabra era</div><h1>${esc(S.word)}</h1></div>`}
function render(){
  if(S.turn!==lastTurn){lastTurn=S.turn;ops=[];clearCv();if(S.phase==="choose")say(`✏️ ${esc(nameOf(S.drawer))} va a dibujar`,"sy")}
  const me=myPeer(),w=S.word||"";let ph="",hn="";
  if(S.phase==="lobby")ph="Esperando jugadores…";else if(S.phase==="end")ph="¡Fin!";
  else if(S.phase==="choose")ph=S.drawer===me?"Elige palabra":"Eligiendo palabra…";
  else if(S.phase==="reveal"){ph="La palabra era";hn=w}
  else if(isDrawer()){ph="DIBUJA ESTO";hn=w.toUpperCase()}else{ph="ADIVINA";hn=hintText()}
  $("ph").textContent=ph;$("hint").textContent=hn;
  $("tm").textContent=(S.phase==="draw"||S.phase==="choose"||S.phase==="reveal")?"⏰ "+S.left:"";
  const n=Math.max(1,ids().length);$("rd").textContent=S.turn>=0&&S.phase!=="end"?`Ronda ${Math.floor(S.turn/n)+1} de ${S.cfg.rounds}`:"";
  $("tools").classList.toggle("hide",!isDrawer());
  $("gi").disabled=isDrawer()||S.guessed.includes(me);
  const sc=ids().sort((a,b)=>(S.scores[b]||0)-(S.scores[a]||0));
  plSet(sc.map((id,i)=>`<div class="p${S.guessed.includes(id)?" g":""}"><b>#${i+1}</b>${av(pr(id).av||DA,34,(i*.7)%2)}<div><b>${esc(nameOf(id))}${id===me?" (tú)":""}</b>${S.drawer===id&&S.phase==="draw"?" ✏️":""}<small>${S.scores[id]||0} puntos</small></div></div>`).join(""));
  renderOv()}
function say(h,c){const d=document.createElement("div");if(c)d.className=c;d.innerHTML=h;$("chat").appendChild(d);$("chat").scrollTop=1e9}
function lev(a,b){const m=[...Array(a.length+1)].map((_,i)=>[i]);for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return m[a.length][b.length]}
/* herramientas */
const TL=[["pen","✏️","Lápiz"],["marker","🖊️","Rotulador"],["spray","🎨","Spray"],["fill","🪣","Cubo de pintura"],["eraser","🧽","Goma"]];
function buildTools(){const t=$("tools");
  t.innerHTML=`<div id="pal">${PAL.map(c=>`<i data-c="${c}" style="background:${c}"></i>`).join("")}</div><span id="tb"></span><span id="sb"></span><button class="tb" id="un" title="Deshacer">↩️</button><button class="tb" id="cl" title="Borrar todo">🗑️</button>`;
  $("tb").innerHTML=TL.map(([k,e,n])=>`<button class="tb" data-t="${k}" title="${n}">${e}</button>`).join("");
  $("sb").innerHTML=[3,6,12,24].map(s=>`<button class="tb" data-s="${s}"><span style="display:inline-block;width:${s/1.5+4}px;height:${s/1.5+4}px;border-radius:50%;background:currentColor"></span></button>`).join("");
  const sync=()=>{t.querySelectorAll("[data-t]").forEach(b=>b.classList.toggle("on",b.dataset.t===tool));t.querySelectorAll("[data-s]").forEach(b=>b.classList.toggle("on",+b.dataset.s===sz))};
  t.querySelectorAll("[data-c]").forEach(i=>i.onclick=()=>{col=i.dataset.c;if(tool==="eraser")tool="pen";sync()});
  t.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tool=b.dataset.t;sync()});
  t.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sz=+b.dataset.s;sync()});
  $("un").onclick=()=>R.emit("undo",{});$("cl").onclick=()=>R.emit("clear",{});sync()}
const pt=e=>{const r=cv.getBoundingClientRect();return[Math.max(0,Math.min(799,Math.round((e.clientX-r.left)*800/r.width))),Math.max(0,Math.min(499,Math.round((e.clientY-r.top)*500/r.height)))]};
cv.onpointerdown=e=>{if(!isDrawer())return;const p=pt(e);
  if(tool==="fill"){const o={t:"f",x:p[0],y:p[1],c:col};ops.push(o);drawOp(o);R.emit("fill",o);return}
  drawing=true;cv.setPointerCapture(e.pointerId);last=p;buf=[p];
  cur={t:"s",id:myPeer()+Date.now(),k:tool==="eraser"?"p":tool==="marker"?"m":tool==="spray"?"s":"p",c:tool==="eraser"?"#ffffff":col,w:tool==="eraser"?Math.max(sz,12):sz,p:[p]};ops.push(cur);drawOp({...cur,p:[p]})};
cv.onpointermove=e=>{if(!drawing)return;const p=pt(e);drawOp({...cur,p:cur.k==="s"?[p]:[last,p]});cur.p.push(p);buf.push(p);last=p};
cv.onpointerup=cv.onpointercancel=()=>{drawing=false;flush()};
function flush(){if(R&&cur&&buf.length>(drawing?1:0)){R.emit("stroke",{id:cur.id,k:cur.k,c:cur.c,w:cur.w,p:buf});buf=drawing?[last]:[]}}
setInterval(flush,60);
function submit(){const t=$("gi").value.trim();$("gi").value="";if(t&&R)R.emit("guess",{t:t.slice(0,60)})}
$("gi").onkeydown=e=>{if(e.key==="Enter")submit()};
function makeNet(code,create,pres0){return new Promise((resolve,reject)=>{
  const HID="garabatea-"+code,H={},subs=[],conns={};let list={},me=null,hc=null,done=false,prev=new Set();hostPeer=HID;
  const peer=new Peer(create?HID:undefined);
  const fire=(t,d,from)=>(H[t]||[]).forEach(f=>f({topic:t,data:d,peer:from,isMe:from===me,sameTab:from===me}));
  const plist=()=>Object.keys(list).map(id=>({peer:id,isMe:id===me,sameTab:id===me,presence:list[id]}));
  const notify=()=>{const pl=plist(),joined=pl.filter(p=>!prev.has(p.peer));prev=new Set(pl.map(p=>p.peer));subs.forEach(f=>f({peers:pl,joined,left:[]}))};
  const bc=()=>Object.values(conns).forEach(c=>c.open&&c.send({k:"peers",list}));
  const api={
    emit(t,d){fire(t,d,me);const m={k:"ev",t,d,from:me};if(create)Object.values(conns).forEach(c=>c.open&&c.send(m));else if(hc&&hc.open)hc.send(m);return Promise.resolve()},
    on(t,f){(H[t]=H[t]||[]).push(f)},
    presence(p){list[me]=Object.assign(list[me]||{},p);if(create){bc();notify()}else if(hc&&hc.open)hc.send({k:"pres",p:list[me]});return Promise.resolve()},
    onPeers(f){subs.push(f);if(me)f({peers:plist(),joined:plist(),left:[]})}};
  peer.on("open",id=>{me=id;list[me]=pres0;
    if(create){done=true;resolve(api);notify();return}
    hc=peer.connect(HID,{reliable:true,serialization:"json"});
    const to=setTimeout(()=>{if(!done)reject("No se pudo conectar con la sala. Revisa el código o que el anfitrión ya la haya creado.")},12000);
    hc.on("open",()=>{hc.send({k:"hello",p:pres0});done=true;clearTimeout(to);resolve(api)});
    hc.on("data",m=>{if(m.k==="peers"){list=m.list;notify()}else if(m.k==="ev")fire(m.t,m.d,m.from)});
    hc.on("close",()=>say("⚠️ El anfitrión se ha desconectado. Recarga la página para crear otra sala.","cl"))});
  if(create)peer.on("connection",c=>{
    c.on("data",m=>{
      if(m.k==="hello"){conns[c.peer]=c;list[c.peer]=m.p;bc();notify()}
      else if(m.k==="pres"){list[c.peer]=m.p;bc();notify()}
      else if(m.k==="ev"){const mm={...m,from:c.peer};Object.entries(conns).forEach(([i,o])=>i!==c.peer&&o.open&&o.send(mm));fire(m.t,m.d,c.peer)}});
    c.on("close",()=>{delete conns[c.peer];delete list[c.peer];bc();notify()})});
  peer.on("error",e=>{if(done)return;reject(e.type==="unavailable-id"?"Esa sala ya existe. Pulsa «Entrar» o elige otro código.":e.type==="peer-unavailable"?"Esa sala no existe todavía. El anfitrión debe crearla primero.":"Error de conexión: "+e.type)})})}
async function enter(c,create){
  myName=$("nm").value.trim()||"Jugador";code=(c||"").toLowerCase().replace(/[^a-z0-9]/g,"");if(!code){$("err").textContent="Escribe un código de sala.";return}
  $("err").textContent="Conectando…";
  try{R=await makeNet(code,create,{name:myName,av:A});
    R.onPeers(c=>{const j=c.joined.some(x=>!x.isMe);peers=c.peers;if(j&&isHost())send();render()});
    R.on("state",m=>{S=m.data;render()});
    R.on("start",()=>{if(!isHost())return;S.phase="reveal";S.turn=-1;S.scores={};nextTurn()});
    R.on("pick",m=>{if(isHost()&&S.phase==="choose"&&m.peer===S.drawer&&S.opts[m.data.i])startDraw(S.opts[m.data.i])});
    R.on("clear",()=>{ops=[];clearCv()});
    R.on("undo",()=>{ops.pop();redraw()});
    R.on("fill",m=>{if(m.isMe)return;ops.push(m.data);drawOp(m.data)});
    R.on("stroke",m=>{if(m.isMe)return;const d=m.data;if(!d||!d.p||!d.p.length)return;let o=ops[ops.length-1];if(o&&o.id===d.id)o.p.push(...d.p);else{o={t:"s",...d};ops.push(o)}drawOp(d)});
    R.on("guess",m=>{const t=String(m.data.t||""),n=esc(nameOf(m.peer)),w=S.word||"~";
      const hit=S.phase==="draw"&&norm(t)===norm(w);
      if(hit&&m.peer!==S.drawer)say("✔ "+n+" ha acertado","okc");
      else if(!hit)say("<b>"+n+":</b> "+esc(t));
      if(S.phase==="draw"&&!hit&&m.isMe&&m.peer!==S.drawer&&lev(norm(t),norm(w))===1)say("¡Casi lo tienes!","cl");
      if(hit&&isHost()&&m.peer!==S.drawer&&!S.guessed.includes(m.peer)){S.guessed.push(m.peer);
        S.scores[m.peer]=(S.scores[m.peer]||0)+50+Math.round(450*S.left/S.cfg.time);S.scores[S.drawer]=(S.scores[S.drawer]||0)+60;send()}});
    buildTools();clearCv();$("cp").textContent="Sala: "+code+" 📋";$("cp").onclick=()=>{try{navigator.clipboard.writeText(code)}catch(e){}};
    $("home").classList.add("hide");$("game").classList.remove("hide");render()
  }catch(e){$("err").textContent="Error: "+(e.message||e.code||e)}}
let myName="";
$("go").onclick=()=>enter($("rc").value,false);
$("mk").onclick=()=>enter($("rc").value||Math.random().toString(36).slice(2,7),true);
clearCv();
</script></body></html>
